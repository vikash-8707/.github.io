<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>How to Embed Flourish Bubble Explorer into Any Webpage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f1f5f9;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .website-card {
      background: #ffffff;
      max-width: 900px;
      width: 100%;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-bottom: 6px;
      color: #0f172a;
    }

    p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* Container for the bubble chart */
    #my-bubble-chart {
      width: 100%;
      height: 550px;
      border-radius: 12px;
      background: #fafafa;
      position: relative;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    /* Dark tooltip badge */
    .flourish-bubble-tooltip {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -100%);
      z-index: 100;
      transition: opacity 0.15s ease;
    }
    .tooltip-badge {
      background: #22262c;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      white-space: nowrap;
    }
    .tooltip-title { font-size: 14px; font-weight: 700; }
    .tooltip-details { font-size: 11.5px; color: #cbd5e1; display: flex; gap: 8px; margin-top: 3px; }
  </style>

  <!-- Step 1: Include D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  <div class="website-card">
    <h2>Global Countries Explorer</h2>
    <p>Interactive bubble cluster with force-directed physics. Click and drag bubbles!</p>

    <!-- Step 2: Add chart container -->
    <div id="my-bubble-chart"></div>
  </div>

  <!-- Step 3: Include data.js and bubble-chart.js -->
  <script src="data.js"></script>
  <script src="bubble-chart.js"></script>

  <!-- Step 4: Initialize the chart -->
  <script>
    const chart = new FlourishBubbleChart('#my-bubble-chart', COUNTRIES_DATA, {
      position: 'none',   // 'none' for single cluster, or 'region' to split
      sizeBy: 'none',     // 'none', 'pop', or 'gdp'
      colorBy: 'none'     // 'none' for Flourish grey, or 'region'
    });
  </script>

</body>
</html>
