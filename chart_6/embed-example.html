<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embed Example - Flourish Sankey Diagram (US Energy Flow)</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
  <script src="data.js"></script>
  <script src="sankey.js"></script>
</head>
<body style="background: #f8fafc; padding: 30px; display: flex; justify-content: center;">

  <!-- Standalone Chart Card -->
  <div style="max-width: 1000px; width: 100%; background: #ffffff; border-radius: 12px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);">
    <h2 style="font-size: 18px; margin-bottom: 6px; color: #0f172a;">US Energy Flow (2017)</h2>
    <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">Lawrence Livermore National Laboratory Energy Sankey in Quads</p>
    
    <div id="embed-sankey-container"></div>
  </div>

  <script>
    // Minimal 3-line embed
    const mySankey = new FlourishSankey('#embed-sankey-container', ENERGY_SANKEY_DATA, {
      align: 'justify',
      iterations: 10,
      selectedLink: { source: 'Petroleum', target: 'Industrial' }
    });
  </script>

</body>
</html>
