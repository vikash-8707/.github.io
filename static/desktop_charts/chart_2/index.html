<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flourish Probability Gauge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Stage -->
  <main class="gauge-app">
    <div id="gauge-mount"></div>
  </main>

  <script src="gauge.js"></script>
  <script>
    if (new URLSearchParams(window.location.search).has('thumb')) {
      document.body.classList.add('thumb-mode');
    }

    document.addEventListener('DOMContentLoaded', () => {
      window.gaugeInstance = new FlourishGauge('#gauge-mount', {
        value: 48,
        label: '3BHK',
        unit: '%',
        autoShake: !new URLSearchParams(window.location.search).has('thumb')
      });
    });
  </script>
</body>
</html>
