<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>How to Embed Clean Flourish Gauge into Any Webpage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Optional: Google Fonts for elegant typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f1f5f9;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    /* Your custom card or section on your existing website */
    .website-card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h2 {
      margin-bottom: 6px;
      color: #0f172a;
      font-size: 20px;
    }

    p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* Container for the gauge */
    .my-gauge-box {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    /* Clean meter text & 3D needle styles */
    .needle-facet-left { fill: #6b727d; }
    .needle-facet-right { fill: #434953; }
    .gauge-hub-circle { fill: #50555e; stroke: #ffffff; stroke-width: 2px; }
    .gauge-readout-label { font-size: 15px; font-weight: 700; fill: #64748b; letter-spacing: 0.5px; }
    .gauge-readout-value { font-size: 40px; font-weight: 800; fill: #0f172a; }
  </style>
</head>
<body>

  <!-- Your existing website card / section -->
  <div class="website-card">
    <h2>Apartment Booking Probability</h2>
    <p>Live predictive analytics based on current market trends</p>

    <!-- STEP 1: Put this div where you want the gauge -->
    <div id="property-gauge" class="my-gauge-box"></div>
  </div>

  <!-- STEP 2: Include the gauge.js file -->
  <script src="gauge.js"></script>

  <!-- STEP 3: Initialize the gauge with your value and label -->
  <script>
    const gauge = new FlourishGauge('#property-gauge', {
      label: '2BHK',    // Subtitle label
      value: 81,        // Target value (0 to 100)
      unit: '%',        // Unit suffix
      animated: true,   // Smooth needle swing & number count-up
      duration: 1400    // Animation speed in milliseconds
    });

    // You can update the value anytime:
    // gauge.setValue(95);
  </script>

</body>
</html>
